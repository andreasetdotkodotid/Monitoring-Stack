groups:
  - name: target.availability.alerts
    rules:
      - alert: HostDown
        expr: host:up:probe_icmp == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Host {{ $labels.host }} is down
          description: ICMP probe failed for {{ $labels.host }}.

      - alert: ICMPDown
        expr: probe_success{job="blackbox_icmp"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: ICMP down for {{ $labels.host }}
          description: Ping to {{ $labels.instance }} failed.

      - alert: HTTPDown
        expr: probe_success{job="blackbox_http",probe_scheme="http"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: HTTP down for {{ $labels.probe_url }}
          description: HTTP probe failed for {{ $labels.probe_url }}.

      - alert: HTTPSDown
        expr: probe_success{job="blackbox_http",probe_scheme="https"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: HTTPS down for {{ $labels.probe_url }}
          description: HTTPS probe failed for {{ $labels.probe_url }}.

      - alert: TCPPortDown
        expr: probe_success{job="blackbox_tcp"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: TCP port {{ $labels.port }} down on {{ $labels.host }}
          description: TCP probe failed for {{ $labels.instance }}.

      - alert: NginxDown
        expr: probe_success{job="nginx_stub_status"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Nginx status endpoint down on {{ $labels.host }}
          description: Nginx stub_status probe failed for {{ $labels.instance }}.

  - name: exporter.alerts
    rules:
      - alert: NodeExporterDown
        expr: up{job="node"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Node Exporter down on {{ $labels.host }}
          description: Prometheus cannot scrape Node Exporter on {{ $labels.instance }}.

      - alert: BlackboxExporterDown
        expr: up{job="blackbox-exporter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Blackbox Exporter down
          description: Prometheus cannot scrape Blackbox Exporter.

  - name: node.resource.alerts
    rules:
      - alert: HighCPUUsage
        expr: node:cpu_usage:ratio > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: High CPU usage on {{ $labels.host }}
          description: CPU usage above 85% for 10 minutes.

      - alert: HighMemoryUsage
        expr: node:memory_usage:ratio{job="node"} > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: High memory usage on {{ $labels.host }}
          description: Memory usage above 90% for 10 minutes.

      - alert: HighLoadAverage
        expr: node_load1{job="node"} / count by (product, application, service, environment, location, team, host, instance) (node_cpu_seconds_total{job="node",mode="idle"}) > 1.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: High load average on {{ $labels.host }}
          description: 1-minute load average is high compared to CPU cores.

      - alert: DiskUsageHigh
        expr: node:filesystem_usage:ratio{job="node"} > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Disk usage high on {{ $labels.host }} {{ $labels.mountpoint }}
          description: Filesystem usage above 85%.

      - alert: FilesystemReadOnly
        expr: node_filesystem_readonly{job="node",fstype!~"tmpfs|fuse.lxcfs|overlay|squashfs"} == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Filesystem read-only on {{ $labels.host }} {{ $labels.mountpoint }}
          description: Filesystem is mounted read-only.

      - alert: LowDiskInode
        expr: node:inode_usage:ratio{job="node"} > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Low disk inode on {{ $labels.host }} {{ $labels.mountpoint }}
          description: Inode usage above 85%.

      - alert: OOMKiller
        expr: increase(node_vmstat_oom_kill{job="node"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: OOM killer triggered on {{ $labels.host }}
          description: Kernel OOM killer event detected.

      - alert: SwapUsageHigh
        expr: (1 - (node_memory_SwapFree_bytes{job="node"} / node_memory_SwapTotal_bytes{job="node"})) > 0.50 and node_memory_SwapTotal_bytes{job="node"} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Swap usage high on {{ $labels.host }}
          description: Swap usage above 50%.
