route:
  receiver: email-default
  group_by: [alertname, project, service, host]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: alert-history
      continue: true
      matchers:
        - alertname=~".+"
    - receiver: email-critical
      repeat_interval: 1h
      matchers:
        - severity="critical"
    - receiver: email-default
      matchers:
        - severity!="critical"

receivers:
  - name: alert-history
    webhook_configs:
      - url: http://alert-history:8080/webhook
        send_resolved: true

  - name: email-default
    email_configs:
      - to: ${SMTP_TO}
        from: ${SMTP_FROM}
        smarthost: ${SMTP_SMARTHOST}
        auth_username: ${SMTP_AUTH_USERNAME}
        auth_password: ${SMTP_AUTH_PASSWORD}
        require_tls: ${SMTP_REQUIRE_TLS}
        send_resolved: true

  - name: email-critical
    email_configs:
      - to: ${SMTP_TO}
        from: ${SMTP_FROM}
        smarthost: ${SMTP_SMARTHOST}
        auth_username: ${SMTP_AUTH_USERNAME}
        auth_password: ${SMTP_AUTH_PASSWORD}
        require_tls: ${SMTP_REQUIRE_TLS}
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - alertname="HostDown"
    target_matchers:
      - alertname=~"ICMPDown|NodeExporterDown|TCPPortDown|HTTPDown|HTTPSDown"
    equal: [project, host]
