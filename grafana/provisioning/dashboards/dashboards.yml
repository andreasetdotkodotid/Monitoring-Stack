apiVersion: 1

providers:
  - name: Nusawork Monitoring
    orgId: 1
    folder: Production Monitoring
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/production

  - name: HRIS Monitoring
    orgId: 1
    folder: HRIS Monitoring
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/hris
